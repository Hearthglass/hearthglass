<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a1d" />
    <meta
      name="description"
      content="A pixel-art wizard on the roof of his moonlit observatory. Hold on the moon to charge his staff; charge long enough and the moon will not survive it."
    />
    <title>Moonspire • Hearthglass</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="habitat" aria-label="Interactive pixel-art wizard scene">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="A pixel-art wizard on the roof of his observatory under the moon. Hold on the moon to charge a spell, tap the sky for fireworks, tap the owl, the brazier, the lantern, the orrery, the telescope or the wizard. E casts a spell. Space pauses. F enters fullscreen. H hides controls."
      ></canvas>
      <nav class="chrome" aria-label="Habitats">
        <a class="home-link" href="../../" aria-label="Habitats home">Habitats</a>
        <div class="scene-nav">
          <a href="../riverscape/">Riverscape</a>
          <a href="../reefscape/">Reefscape</a>
          <span aria-current="page">Moonspire</span>
          <a href="../pixelreef/">Pixel Reef</a>
        </div>
      </nav>
      <footer class="chrome" aria-label="Scene controls">
        <div class="buttons">
          <button disabled id="pause" aria-pressed="false" title="Space">Pause</button>
          <button disabled id="action" title="E">Cast a spell</button>
          <button disabled id="fullscreen" title="F">Fullscreen</button>
        </div>
        <div class="preferences">
          <select disabled id="quality" aria-label="Quality">
            <option value="eco">Eco</option>
            <option value="balanced" selected>Balanced</option>
            <option value="detail">Detail</option>
          </select>
          <button disabled id="hide" title="H">Hide controls</button>
        </div>
      </footer>
      <div id="tool-status" class="tool-status" role="status" aria-live="polite"></div>
      <button disabled id="show-controls" title="H">Show controls</button>
      <div id="loading" role="status"><p>Lighting the brazier…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
