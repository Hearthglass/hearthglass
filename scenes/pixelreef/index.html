<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#061629" />
    <meta
      name="description"
      content="A pixel-art reef tank: clownfish in their anemone, a school of chromis, a pufferfish, jellyfish, a crab, and an octopus in its cave. Tap to feed, drag to stir."
    />
    <title>Pixel Reef • Hearthglass</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="habitat" aria-label="Interactive pixel-art reef aquarium">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="A pixel-art reef aquarium. Tap the water to feed, hold to hand-feed, drag to stir the water. Tap the pufferfish, the chest, the castle, the octopus cave, the crab or a jellyfish. E feeds, L switches the tank light. Space pauses. F enters fullscreen. H hides controls."
      ></canvas>
      <nav class="chrome" aria-label="Habitats">
        <a class="home-link" href="../../" aria-label="Habitats home">Habitats</a>
        <div class="scene-nav">
          <a href="../riverscape/">Riverscape</a>
          <a href="../reefscape/">Reefscape</a>
          <a href="../moonspire/">Moonspire</a>
          <span aria-current="page">Pixel Reef</span>
        </div>
      </nav>
      <footer class="chrome" aria-label="Scene controls">
        <div class="buttons">
          <button disabled id="pause" aria-pressed="false" title="Space">Pause</button>
          <button disabled id="action" title="E">Feed</button>
          <button disabled id="fullscreen" title="F">Fullscreen</button>
        </div>
        <div class="preferences">
          <select disabled id="quality" aria-label="Quality">
            <option value="eco">Eco</option>
            <option value="balanced" selected>Balanced</option>
            <option value="detail">Detail</option>
          </select>
          <button disabled id="hide" title="H">Hide controls</button>
        </div>
      </footer>
      <div id="tool-status" class="tool-status" role="status" aria-live="polite"></div>
      <button disabled id="show-controls" title="H">Show controls</button>
      <div id="loading" role="status"><p>Filling the tank…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
