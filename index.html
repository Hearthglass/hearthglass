<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09110f" />
    <meta name="description" content="Living desktop scenes. Explore a planted river, a coral reef, a wizard's moonlit observatory or a pixel-art reef tank, in your browser or on your desktop." />
    <title>Habitats — living desktop scenes</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="ui/gallery.css" />
  </head>
  <body>
    <header class="masthead">
      <h1><span class="logo-placeholder" aria-hidden="true"></span>Desktop Habitats</h1>
    </header>
    <main class="gallery" aria-label="Habitats" aria-roledescription="carousel" aria-describedby="gallery-help" aria-keyshortcuts="ArrowLeft ArrowRight">
      <p class="sr-only" id="gallery-help">Swipe, select the next preview, or use the left and right arrow keys to choose a habitat. Open the selected image or name to enter.</p>
      <p class="sr-only" id="gallery-status" role="status" aria-live="polite" aria-atomic="true">Riverscape</p>
      <a draggable="false" class="portal river is-active" id="river" href="scenes/riverscape/" aria-label="Open Riverscape">
        <div class="portal-image">
          <span class="preview-status" hidden>Preview unavailable</span>
          <img draggable="false" src="docs/images/riverscape-wide.png" alt="Fish swimming through green rivergrass and driftwood" width="1440" height="750" fetchpriority="high" />
        </div>
        <div class="portal-caption">
          <h2>Riverscape<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
      <a draggable="false" class="portal reef" id="reef" role="button" href="scenes/reefscape/" aria-label="Preview Reefscape">
        <div class="portal-image">
          <span class="preview-status" hidden>Preview unavailable</span>
          <img draggable="false" src="docs/images/reefscape-wide.png" alt="A coral reef with clownfish, anemones and branching corals" width="1440" height="750" />
        </div>
        <div class="portal-caption">
          <h2>Reefscape<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
      <a draggable="false" class="portal moonspire pixel" id="moonspire" role="button" href="scenes/moonspire/" aria-label="Preview Moonspire">
        <div class="portal-image">
          <span class="preview-status" hidden>Preview unavailable</span>
          <img draggable="false" src="docs/images/moonspire-wide.png" alt="A pixel-art wizard with a glowing staff on the roof of his domed observatory under a full moon" width="1440" height="750" />
        </div>
        <div class="portal-caption">
          <h2>Moonspire<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
      <a draggable="false" class="portal pixelreef pixel" id="pixelreef" role="button" href="scenes/pixelreef/" aria-label="Preview Pixel Reef">
        <div class="portal-image">
          <span class="preview-status" hidden>Preview unavailable</span>
          <img draggable="false" src="docs/images/pixelreef-wide.png" alt="A pixel-art reef tank with tangs, clownfish, jellyfish and corals" width="1440" height="750" />
        </div>
        <div class="portal-caption">
          <h2>Pixel Reef<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
    </main>
    <script type="module" src="ui/gallery.js"></script>
  </body>
</html>
